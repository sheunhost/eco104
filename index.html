function show(id){["gate","menu","app"].forEach(function(x){document.getElementById(x).classList.toggle("on",x==id)})}
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function unlock(){var v=document.getElementById("pw").value;if(await sha(v)===H){try{sessionStorage.setItem("ok","1")}catch(e){}show("menu")}else{document.getElementById("err").textContent="Wrong password. Try again."}}
document.getElementById("go").onclick=unlock;document.getElementById("pw").onkeydown=function(e){if(e.key=="Enter")unlock()};
try{if(sessionStorage.getItem("ok")=="1")show("menu")}catch(e){}
document.querySelectorAll(".card").forEach(function(c){c.onclick=function(){var a=A[c.dataset.a];var bin=atob(a[0]),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);document.getElementById("fr").srcdoc=new TextDecoder().decode(u);document.getElementById("ttl").textContent=a[1];show("app")}});
document.getElementById("back").onclick=function(){if(confirm("Leave this CBT? Your current progress will be lost.")){document.getElementById("fr").srcdoc="";show("menu")}};
